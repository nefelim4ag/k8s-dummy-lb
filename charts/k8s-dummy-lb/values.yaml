image:
  repository: ghcr.io/nefelim4ag/k8s-dummy-lb
  tag: "{{ .Chart.AppVersion }}"
  pullPolicy: IfNotPresent
  imagePullSecrets: []

serviceAccount:
  annotations: {}

replicas: 1

resources:
  requests:
    cpu: 0.001
    memory: 64Mi

## @param strategy [object] Strategy to use to update Pods
## ref: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#update-strategies
##
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 5%
    maxUnavailable: 10%

env:
  RECONCILE_INTERVAL: "15"
  IPV6_CACHE_TTL: "900"
  DRY_RUN: "false"
  LB_CLASS: "controller.io/node-ip"
  NODE_IPV6_SOURCE: auto  # auto | none
  # NAMESPACE: <name>

hostNetwork: false
dnsConfig: {}

topologySpreadConstraints:
- maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app: "{{ .Release.Name }}"
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app: "{{ .Release.Name }}"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 1
      preference:
        matchExpressions:
        - key: app
          operator: In
          values:
          - "{{ .Release.Name }}"

tolerations: []
